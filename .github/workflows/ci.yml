name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The tests need a real PostgreSQL (the importer and analytics use Postgres features).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: desk
          POSTGRES_PASSWORD: desk
          POSTGRES_DB: desk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U desk -d desk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The test suite creates and migrates its own `desk_test` database next to this one.
      DATABASE_URL: postgresql+psycopg://desk:desk@localhost:5432/desk

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (Python version comes from .python-version)
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t desk-api .

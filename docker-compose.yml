services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: desk
      POSTGRES_PASSWORD: desk
      POSTGRES_DB: desk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desk -d desk"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://desk:desk@db:5432/desk
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      # The frontend lives in its own repository; Compose clones and builds it directly.
      # When working on both repos locally, point this at the sibling checkout instead:
      #   FRONTEND_CONTEXT=../dataset-request-desk-web docker compose up --build
      context: ${FRONTEND_CONTEXT:-https://github.com/Nkusibeni23/dataset-request-desk-web.git#main}
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
